version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    groups:
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "react"
          - "react-native"
      native-libraries:
        patterns:
          - "react-native-*"
          - "@react-navigation/*"
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - "wrangler"
          - "workerd"
      dev-tooling:
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      # Expo SDK 57 and the native modules below move only with Expo's
      # supported-version matrix. Third-party native packages update normally.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@shopify/flash-list"
      - dependency-name: "@sentry/react-native"
      - dependency-name: "react-native"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
