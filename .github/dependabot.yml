version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    ignore:
      # Major upgrades always get an explicit migration and review.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Core native versions below move with Expo's supported-version matrix.
      # Expo package patches may update only when `expo install --check` passes;
      # Expo SDK majors are covered by the rule above.
      - dependency-name: "@shopify/flash-list"
      - dependency-name: "@sentry/react-native"
      - dependency-name: "react-native"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "ci"
      include: "scope"
