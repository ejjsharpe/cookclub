name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check boundaries
        run: bun run check-boundaries

      - name: Lint all workspaces with zero warnings
        run: bun run lint

      - name: Typecheck all workspaces and Worker bindings
        run: bun run check-types

      - name: Run all tests
        run: bun run test

      - name: Verify Expo dependency matrix
        run: bun run check:expo

      - name: Build web and Worker workspaces
        run: bun run build

      - name: Dry-run production Worker deployments
        run: |
          bun run --cwd apps/api dry-run:prod
          bun run --cwd apps/images dry-run:prod
          bun run --cwd apps/recipe-ai dry-run:prod
