name: CI and deployment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: Action to run after full validation
        required: true
        default: validate
        type: choice
        options:
          - validate
          - production-update
          - preview-build
          - production-build
      platform:
        description: Native platform for updates and builds
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android

permissions:
  actions: read
  contents: read

jobs:
  checks:
    name: Validate
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deployables: ${{ steps.deployables.outputs.projects }}
    env:
      FULL_VALIDATION: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Derive affected commit range
        if: github.event_name != 'workflow_dispatch'
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check workspace boundaries
        run: bun run check-boundaries

      - name: Lint
        run: |
          if [ "$FULL_VALIDATION" = "true" ]; then
            bunx nx run-many -t lint --nxBail --outputStyle=static
          else
            bunx nx affected -t lint --nxBail --outputStyle=static
          fi

      - name: Check TypeScript
        run: |
          if [ "$FULL_VALIDATION" = "true" ]; then
            bunx nx run-many -t check-types --nxBail --outputStyle=static
          else
            bunx nx affected -t check-types --nxBail --outputStyle=static
          fi

      - name: Test
        run: |
          if [ "$FULL_VALIDATION" = "true" ]; then
            bunx nx run-many -t test --nxBail --outputStyle=static
          else
            bunx nx affected -t test --nxBail --outputStyle=static
          fi

      - name: Build
        run: |
          if [ "$FULL_VALIDATION" = "true" ]; then
            bunx nx run-many -t build --nxBail --outputStyle=static
          else
            bunx nx affected -t build --nxBail --outputStyle=static
          fi

      - name: Check Expo package versions
        run: |
          if [ "$FULL_VALIDATION" = "true" ]; then
            bunx nx run-many -t check:expo-install --nxBail --outputStyle=static
          else
            bunx nx affected -t check:expo-install --nxBail --outputStyle=static
          fi

      - name: Dry-run production Cloudflare deployments
        run: |
          if [ "$FULL_VALIDATION" = "true" ]; then
            bunx nx run-many -t dry-run:prod --nxBail --outputStyle=static
          else
            bunx nx affected -t dry-run:prod --nxBail --outputStyle=static
          fi

      - name: Find affected Cloudflare applications
        id: deployables
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          projects=$(bunx nx show projects --affected --with-target=deploy:prod --json)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "Affected Cloudflare applications: $projects"

  deploy-cloudflare:
    name: Deploy Cloudflare production
    needs: checks
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.checks.outputs.deployables != '[]'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy image service
        if: contains(fromJSON(needs.checks.outputs.deployables), 'cookclub-images')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx nx run cookclub-images:deploy:prod --outputStyle=static

      - name: Deploy recipe AI service
        if: contains(fromJSON(needs.checks.outputs.deployables), 'cookclub-recipe-ai')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx nx run cookclub-recipe-ai:deploy:prod --outputStyle=static

      - name: Deploy API
        if: contains(fromJSON(needs.checks.outputs.deployables), 'cookclub-api')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx nx run cookclub-api:deploy:prod --outputStyle=static

      - name: Deploy admin
        if: contains(fromJSON(needs.checks.outputs.deployables), 'cookclub-admin')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx nx run cookclub-admin:deploy:prod --outputStyle=static

      - name: Deploy website
        if: contains(fromJSON(needs.checks.outputs.deployables), 'cookclub-web')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx nx run cookclub-web:deploy:prod --outputStyle=static

      - name: Smoke-test image service
        if: contains(fromJSON(needs.checks.outputs.deployables), 'cookclub-images')
        run: >-
          curl --fail --silent --show-error --retry 12 --retry-delay 5
          --retry-all-errors --connect-timeout 10 --max-time 20
          https://images.cookclub.app/health > /dev/null

      - name: Smoke-test API
        if: >-
          contains(fromJSON(needs.checks.outputs.deployables), 'cookclub-recipe-ai') ||
          contains(fromJSON(needs.checks.outputs.deployables), 'cookclub-api')
        run: >-
          curl --fail --silent --show-error --retry 12 --retry-delay 5
          --retry-all-errors --connect-timeout 10 --max-time 20
          https://api.cookclub.app/health > /dev/null

      - name: Smoke-test admin
        if: contains(fromJSON(needs.checks.outputs.deployables), 'cookclub-admin')
        run: >-
          curl --fail --silent --show-error --retry 12 --retry-delay 5
          --retry-all-errors --connect-timeout 10 --max-time 20
          https://admin.cookclub.app > /dev/null

      - name: Smoke-test website
        if: contains(fromJSON(needs.checks.outputs.deployables), 'cookclub-web')
        run: >-
          curl --fail --silent --show-error --retry 12 --retry-delay 5
          --retry-all-errors --connect-timeout 10 --max-time 20
          https://cookclub.app > /dev/null

  native-release:
    name: Native ${{ inputs.action }} (${{ inputs.platform }})
    needs: checks
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action != 'validate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish production EAS Update
        if: inputs.action == 'production-update'
        working-directory: apps/native
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
        run: >-
          bunx eas update --platform "$PLATFORM" --channel production
          --environment production --message "GitHub Actions ${GITHUB_SHA}"
          --non-interactive

      - name: Queue preview build
        if: inputs.action == 'preview-build'
        working-directory: apps/native
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
        run: >-
          bunx eas build --platform "$PLATFORM" --profile preview
          --non-interactive --no-wait

      - name: Build and submit to beta stores
        if: inputs.action == 'production-build'
        working-directory: apps/native
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
        run: >-
          bunx eas build --platform "$PLATFORM" --profile production
          --auto-submit --non-interactive --wait
