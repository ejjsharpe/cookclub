name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    if: >-
      github.repository == 'ejjsharpe/cook-club' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Dependabot PRs
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (
            steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
            (
              steps.metadata.outputs.package-ecosystem == 'github_actions' ||
              steps.metadata.outputs.dependency-names == '@astrojs/check' ||
              startsWith(steps.metadata.outputs.dependency-names, '@types/') ||
              steps.metadata.outputs.dependency-names == '@vitejs/plugin-react' ||
              startsWith(steps.metadata.outputs.dependency-names, '@nx/') ||
              steps.metadata.outputs.dependency-names == 'eslint' ||
              startsWith(steps.metadata.outputs.dependency-names, 'eslint-') ||
              contains(fromJSON('["nx","prettier","typescript","vite","vitest","wait-on","expo-doctor"]'), steps.metadata.outputs.dependency-names)
            )
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
